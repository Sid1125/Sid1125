name: Generate GitHub Stats

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch live SVG cards
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/generated

          curl -L --retry 3 --fail \
            "https://github-readme-stats.vercel.app/api?username=Sid1125&show_icons=true&hide_border=true&bg_color=00000000&title_color=8B0000&icon_color=8B0000&text_color=ffffff&border_radius=12&disable_animations=true" \
            -o assets/generated/github-stats.svg

          curl -L --retry 3 --fail \
            "https://streak-stats.demolab.com?user=Sid1125&theme=dark&hide_border=true&ring=8B0000&fire=8B0000&currStreakLabel=8B0000&background=00000000" \
            -o assets/generated/github-streak.svg

          curl -L --retry 3 --fail \
            "https://github-readme-stats.vercel.app/api/top-langs/?username=Sid1125&layout=compact&hide_border=true&bg_color=00000000&title_color=8B0000&text_color=ffffff&disable_animations=true" \
            -o assets/generated/top-langs.svg

          curl -L --retry 3 --fail \
            "https://github-readme-activity-graph.vercel.app/graph?username=Sid1125&bg_color=000000&color=ffffff&line=8B0000&point=ffffff&area=true&hide_border=true" \
            -o assets/generated/activity-graph.svg

      - name: Sanitize blocked external font imports
        shell: bash
        run: |
          set -euo pipefail
          for file in assets/generated/*.svg; do
            perl -0pi -e 's/\@import\s+url\([^)]+\);\s*//g; s/\@font-face\s*\{.*?\}\s*//gs; s/fonts\.googleapis\.com//g; s/fonts\.gstatic\.com//g' "$file"
          done

      - name: Commit generated SVGs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/generated/*.svg
          git diff --cached --quiet && exit 0
          git commit -m "chore: update generated github stats"
          git push
