<svg width="1600" height="520" viewBox="0 0 1600 520" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#050505"/>
      <stop offset="100%" stop-color="#111111"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4a0000"/>
      <stop offset="100%" stop-color="#8b0000"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M 80 0 L 0 0 0 80" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.08"/>
    </pattern>
  </defs>

  <rect width="1600" height="520" fill="url(#bg)"/>
  <rect width="1600" height="520" fill="url(#grid)"/>

  <path d="M0 420 C220 360 350 460 560 390 C740 330 890 360 1060 280 C1260 190 1410 235 1600 150"
        fill="none" stroke="url(#red)" stroke-width="3" opacity="0.55"/>
  <path d="M0 452 C260 395 390 485 620 426 C835 372 960 405 1170 330 C1370 260 1475 300 1600 240"
        fill="none" stroke="#8b0000" stroke-width="1.5" opacity="0.35"/>

  <g transform="translate(1265 255)" filter="url(#glow)">
    <circle r="155" stroke="#8b0000" stroke-width="2" fill="none" opacity="0.5"/>
    <circle r="110" stroke="#8b0000" stroke-width="1.5" fill="none" opacity="0.45"/>
    <circle r="70" stroke="#8b0000" stroke-width="1.5" fill="none" opacity="0.45"/>
    <line x1="-170" y1="0" x2="170" y2="0" stroke="#8b0000" stroke-width="1" opacity="0.45"/>
    <line x1="0" y1="-170" x2="0" y2="170" stroke="#8b0000" stroke-width="1" opacity="0.45"/>
    <path d="M0 0 L140 -92" stroke="#8b0000" stroke-width="4" opacity="0.75">
      <animateTransform attributeName="transform" attributeType="XML" type="rotate"
        from="0 0 0" to="360 0 0" dur="6s" repeatCount="indefinite"/>
    </path>
    <circle r="6" fill="#8b0000"/>
  </g>

  <g font-family="JetBrains Mono, Consolas, monospace">
    <text x="120" y="170" fill="#ffffff" font-size="58" font-weight="700">SIDDHARTH SINHA</text>
    <text x="120" y="228" fill="#8b0000" font-size="25" font-weight="600">CYBERSECURITY RESEARCHER</text>
    <text x="120" y="268" fill="#8b0000" font-size="25">DIGITAL FORENSICS</text>
    <text x="120" y="308" fill="#8b0000" font-size="25">THREAT INTELLIGENCE</text>
    <rect x="120" y="350" width="430" height="2" fill="#8b0000"/>
    <text x="120" y="405" fill="#888888" font-size="18">BUILD | ANALYZE | INVESTIGATE | DEFEND</text>
  </g>
</svg>
